name: go test
on: [push, pull_request]

jobs:

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Test
      run: go test -v ./...
